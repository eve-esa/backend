services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8001:8000
    command:
      [
        "uvicorn",
        "server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/code",
      ]
    env_file:
      - .env
    environment:
      # Override .env values for Docker networking
      - MONGO_HOST=mongo
      - REDIS_URL=redis://redis:6379/0
      # generate-agentic MCP client calls this app’s /mcp/*; host :8001 is not open inside the container
      - MCP_PROXY_INTERNAL_BASE_URL=http://127.0.0.1:8000
      # Langfuse: use a separate var so load_dotenv(override=True) can't clobber it
      - LANGFUSE_INTERNAL_URL=http://langfuse-web:3000
      # S3 / artifact storage points at the local images MinIO container in-network
      # (distinct from the langfuse-observability `minio` service below).
      - S3_ENDPOINT_URL=http://minio-images:9000
      - S3_BUCKET_NAME=eve-x-artifacts-local
      - S3_REGION=eu-central-1
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      # Identity provider. The issuer is the address the BROWSER uses, because
      # that is the value that ends up in the token; the discovery URL is how
      # this container reaches the same realm from inside the network. Keycloak
      # reconciles the two via KC_HOSTNAME_BACKCHANNEL_DYNAMIC.
      # NOTE: backend/.env is loaded with override=True, so a stale AUTH_* there
      # silently wins over these.
      - AUTH_ISSUER=http://localhost:${KEYCLOAK_PORT:-8080}/realms/eve
      - AUTH_DISCOVERY_URL=http://keycloak:8080/realms/eve/.well-known/openid-configuration
      - AUTH_CLIENT_ID=eve-frontend
      - AUTH_ALLOW_INSECURE_HTTP=true
    volumes:
      - .:/code
    depends_on:
      - mongo
      - redis
      - langfuse-web
      - minio-images
      - dummy-mcp
      - keycloak
    networks:
      - app-network

  # Local stand-in for Cognito. The application cannot tell the two apart: it
  # knows an issuer, an audience and a JWT.
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG:-26.7}
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # One issuer, two routes to it: the browser reaches localhost, the backend
      # reaches keycloak:8080. Pinning the hostname keeps `iss` stable for both
      # and BACKCHANNEL_DYNAMIC lets the backend fetch on the address it can use.
      - KC_HOSTNAME=http://localhost:${KEYCLOAK_PORT:-8080}
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    volumes:
      # Read-only: this is the source of truth, and the container must never be
      # able to write back over it. --import-realm SKIPS an existing realm, so
      # edits here need `docker compose rm -sf keycloak && up -d`, not a restart.
      - ./infra/identity/keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships bash but no curl or wget, so this is a /dev/tcp probe.
      # --import-realm runs before the listener binds, so an open port means the
      # realm is in. Kept identical to the stack-root compose on purpose.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    networks:
      - app-network

  # Dummy MCP server for artifact-ingestion e2e testing (tests/e2e/test_artifact_e2e.py).
  # No host port needed: the backend and the e2e test reach it by service name.
  dummy-mcp:
    build:
      context: ./tests/e2e/dummy_mcp_server
      dockerfile: Dockerfile
    networks:
      - app-network

  frontend:
    build:
      context: ../frontend
      target: dev
    ports:
      - 5173:5173
    environment:
      # Must be reachable from the browser, not just the compose network.
      - VITE_API_URL=http://localhost:8000
      - VITE_ENABLE_STREAMING=true
      # Same-machine Keycloak: the issuer must be the browser-visible host.
      - VITE_AUTH_ISSUER=http://localhost:${KEYCLOAK_PORT:-8080}/realms/eve
      - VITE_AUTH_CLIENT_ID=eve-frontend
      - VITE_AUTH_SCOPE=openid profile email
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

  mongo:
    image: mongo:6.0
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # MinIO for image/attachment storage (S3-compatible). Distinct from the
  # langfuse-observability `minio` service further down.
  minio-images:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_images_data:/data
    networks:
      - app-network
    restart: unless-stopped

  minio-images-init:
    image: minio/mc
    depends_on:
      - minio-images
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio-images:9000 minioadmin minioadmin) do echo 'waiting for minio-images...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/eve-x-artifacts-local;
      exit 0;
      "
    networks:
      - app-network

  mailcatcher:
    image: schickling/mailcatcher
    container_name: eve-ai-mailcatcher
    ports:
      - "1025:1025"
      - "6080:1080"
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: redis-server
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Langfuse observability stack ──────────────────────────────────────────

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-createbuckets:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      # Auto-create org, project, and admin user on first boot
      LANGFUSE_INIT_ORG_ID: pischool-org
      LANGFUSE_INIT_ORG_NAME: PiSchool
      LANGFUSE_INIT_PROJECT_ID: pischool-project
      LANGFUSE_INIT_PROJECT_NAME: EVE Backend
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    networks:
      - app-network

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-createbuckets:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
    networks:
      - app-network

  langfuse-db:
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres:/var/lib/postgresql/data
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse-config/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    networks:
      - app-network

  minio:
    image: minio/minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopassword
    command: server /data --console-address ":9090"
    volumes:
      - langfuse_minio:/data
    networks:
      - app-network

  minio-createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio miniopassword;
      mc mb --ignore-existing local/langfuse;
      "
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  mongo_data:
  langfuse_postgres:
  langfuse_clickhouse:
  langfuse_clickhouse_logs:
  langfuse_minio:
  minio_images_data:
