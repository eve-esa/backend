<svg xmlns="http://www.w3.org/2000/svg" width="1071" height="714" viewBox="-40.0 -24.0 1070.7 714.2" role="img"><title>How the prompt is built</title><defs><marker id="ah-default" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#346562" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-async" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#346562" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#cf1d39" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="-40.0" y="-24.0" width="1070.7" height="714.2" fill="#ffffff"/><text x="-20.0" y="-2.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#346562"><tspan x="-20.0" dy="0.0">How the prompt is built</tspan></text><text x="-20.0" y="22.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#173245"><tspan x="-20.0" dy="0.0">One system message, then the messages kept for this call.</tspan></text><g transform="translate(0,56)"><rect x="0" y="16" width="168.0" height="72.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="84.0" y="43.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="84.0" dy="0.0">Clock</tspan><tspan x="84.0" dy="17.5">every call</tspan></text><rect x="180" y="16" width="168.0" height="72.