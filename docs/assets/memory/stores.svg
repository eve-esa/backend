<svg xmlns="http://www.w3.org/2000/svg" width="1426" height="466" viewBox="-40.0 -40.0 1426.0 466.0" role="img"><title>Where conversation memory lives</title><defs><marker id="ah-default" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#346562" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-async" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#346562" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#cf1d39" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="-40.0" y="-40.0" width="1426.0" height="466.0" fill="#ffffff"/><text x="-20.0" y="-18.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#346562"><tspan x="-20.0" dy="0.0">Where conversation memory lives</tspan></text><text x="-20.0" y="6.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#173245"><tspan x="-20.0" dy="0.0">Five stores. Each one has a different writer, reader and lifetime.</tspan></text><g transform="translate(0,56)"><rect x="0" y="0" width="250" height="330" rx="12" fill="#ffffff" stroke="#346562" stroke-width="1.5"/><path d="M0,32 L0,12 Q0,0 12,0 L238,0 Q250,0 250,12 L250,32 Z" fill="#346562"/><text x="125.0" y="16.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="125.0" dy="0.0">messages</