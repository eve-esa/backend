.0">MongoDB</tspan></text><text x="292.0" y="80.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#346562"><tspan x="292.0" dy="0.0">Holds</tspan></text><text x="364.0" y="80.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="364.0" dy="0.0">one summary text,</tspan><tspan x="364.0" dy="15.0">plus first and last id</tspan></text><text x="292.0" y="140.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#346562"><tspan x="292.0" dy="0.0">Writes</tspan></text><text x="364.0" y="140.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="364.0" dy="0.0">rollup (react, simple)</tspan><tspan x="364.0" dy="15.0">or deep copy</tspan></text><text x="292.0" y="200.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#346562"><tspan x="292.0" dy="0.0">Reads</tspan></text><text x="364.0" y="200.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="364.0" dy="0.0">react and</tspan><tspan x="364.0" dy="15.0">simple turns</tspan></text><text x="292.0" y="260.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#346562"><tspan x="292.0" dy="0.0">Lifetime</tspan></text><text x="364.0" y="260.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="364.0" dy="0.0">overwritten on</tspan><tspan x="364.0" dy="15.0">every new summary</tspan></text><text x="673.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="673.0" dy="0.0">MongoDB</tspan></text><text x="566.0" y="80.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#346562"><tspan x="566.0" dy="0.0">Holds</tspan></text><text x="638.0" y="80.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="638.0" dy="0.0">LangGraph thread:</tspan><tspan x="638.0" dy="15.0">messages, summary</tspan><tspan x="638.0" dy="15.0">event, files</tspan></text><text x="566.0" y="140.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#346562"><tspan x="566.0" dy="0.0">Writes</tspan></text><text x="638.0" y="140.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="638.0" dy="0.0">every graph step</tspan></text><text x="566.0" y="200.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#346562"><tspan x="566.0" dy="0.0">Reads</tspan></text><text x="638.0" y="200.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="638.0" dy="0.0">next turn of the</tspan><tspan x="638.0" dy="15.0">same conversation</tspan></text><text x="566.0" y="260.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#346562"><tspan x="566.0" dy="0.0">Lifetime</tspan></text><text x="638.0" y="260.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17324