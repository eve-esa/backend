<svg xmlns="http://www.w3.org/2000/svg" width="996" height="603" viewBox="-40.0 -54.0 996.0 603.0" role="img"><title>What the deep agent&#x27;s model sees</title><defs><marker id="ah-default" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#346562" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-async" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#346562" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#cf1d39" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="-40.0" y="-54.0" width="996.0" height="603.0" fill="#ffffff"/><text x="-20.0" y="-32.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#346562"><tspan x="-20.0" dy="0.0">What the deep agent&#x27;s model sees</tspan></text><text x="-20.0" y="-8.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#173245"><tspan x="-20.0" dy="0.0">The thread keeps every message. The event tells the middleware where the summary stops.</tspan></text><g transform="translate(0,56)"><text x="0.0" y="0.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#346562"><tspan x="0.0" dy="0.0">Thread in checkpointing_db</tspan></text><rect x="0" y="24" width="104.0" height="48.0" rx="14.0" fill="#435e6d" stroke="#435e6d" stroke-width="1.5"/><text x="52.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="52.0" dy="0.0">Human a</tspan></text><rect x="116" y="24" width="104.0" height="48.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="168.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="168.0" dy="0.0">AI</tspan></text><rect x="232" y="24" width="104.0" height="48.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="284.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="284.0" dy="0.0">Tools</tspan></text><rect x="348" y="24" width="104.0" height="48.0" rx="14.0" fill="#435e6d" stroke="#435e6d" stroke-width="1.5"/><text x="400.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="400.0" dy="0.0">Human b</tspan></text><rect x="464" y="24" width="104.0" height="48.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="516.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="516.0" dy="0.0">AI</tspan></text><rect x="580" y="24" width="104.0" height="48.0" rx="14.0" fill="#435e6d" stroke="#435e6d" stroke-width="1.5"/><text x="632.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="632.0" dy="0.0">Human c</tspan></text><rect x="696" y="24" width="104.0" height="48.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="748.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="748.0" dy="0.0">AI</tspan></text><rect x="812" y="24" width="104.0" height="48.0" rx="14.0" fill="#003247" stroke="#003247" stroke-width="1.5"/><text x="864.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="864.0" dy="0.0">Human d</tspan></text><line x1="574.0" y1="-14" x2="574.0" y2="88" stroke="#346562" stroke-width="1.2" stroke-dasharray="6 5"/><text x="582.0" y="-2.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#173245"><tspan x="582.0" dy="0.0">cutoff_index = 5</tspan></text><rect x="0" y="92" width="568.0" height="33.0" rx="16.5" fill="#ffffff" stroke="#346562" stroke-width="1.5"/><text x="284.0" y="108.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="284.0" dy="0.0">Summarized: kept raw, not sent</tspan></text><rect x="580.0" y="92" width="336.0" height="33.0" rx="16.5" fill="#ffffff" stroke="#346562" stroke-width="1.5"/><text x="748.0" y="108.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="748.0" dy="0.0">Kept tail + new message</tspan></text><rect x="0" y="160" width="346.8" height="114" rx="14" fill="#003247"/><text x="18.0" y="180.0" text-anchor="start" dominant-baseline="central" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e8e8e4"><tspan x="18.0" dy="0.0">_summarization_event = {</tspan></text><text x="18.0" y="198.0" text-anchor="start" dominant-baseline="central" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e8e8e4"><tspan x="18.0" dy="0.0">  cutoff_index: 5,</tspan></text><text x="18.0" y="216.0" text-anchor="start" dominant-baseline="central" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e8e8e4"><tspan x="18.0" dy="0.0">  summary_message: HumanMessage(...),</tspan></text><text x="18.0" y="234.0" text-anchor="start" dominant-baseline="central" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e8e8e4"><tspan x="18.0" dy="0.0">  file_path: /conversation_history/&lt;id&gt;.md</tspan></text><text x="18.0" y="252.0" text-anchor="start" dominant-baseline="central" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e8e8e4"><tspan x="18.0" dy="0.0">}</tspan></text><text x="0.0" y="300.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#346562"><tspan x="0.0" dy="0.0">Sent to the model</tspan></text><rect x="0" y="324" width="336.0" height="48.0" rx="14.0" fill="#4a8a7a" stroke="#4a8a7a" stroke-width="1.5"/><text x="168.0" y="348.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="168.0" dy="0.0">Summary message</tspan></text><rect x="348" y="324" width="104.0" height="48.0" rx="14.0" fill="#435e6d" stroke="#435e6d" stroke-width="1.5"/><text x="400.0" y="348.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="400.0" dy="0.0">Human c</tspan></text><rect x="464" y="324" width="104.0" height="48.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="516.0" y="348.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="516.0" dy="0.0">AI</tspan></text><rect x="580" y="324" width="104.0" height="48.0" rx="14.0" fill="#003247" stroke="#003247" stroke-width="1.5"/><text x="632.0" y="348.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="632.0" dy="0.0">Human d</tspan></text><rect x="0" y="384" width="336.0" height="33.0" rx="16.5" fill="#ffffff" stroke="#346562" stroke-width="1.5"/><text x="168.0" y="400.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="168.0" dy="0.0">message_id a through b, search note, &lt;summary&gt;</tspan></text><rect x="0" y="420" width="336.0" height="33.0" rx="16.5" fill="#ffffff" stroke="#346562" stroke-width="1.5"/><text x="168.0" y="436.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="168.0" dy="0.0">extra fields: eve_summary, first id, last id</tspan></text><text x="500.0" y="177.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#173245"><tspan x="500.0" dy="0.0">The system prompt is sent apart:</tspan><tspan x="500.0" dy="15.0">PINNED_CONTEXT, the agent prompt,</tspan><tspan x="500.0" dy="15.0">then the artifact rule.</tspan><tspan x="500.0" dy="15.0">A summary never edits it.</tspan></text></g></svg>