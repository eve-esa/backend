<svg xmlns="http://www.w3.org/2000/svg" width="940" height="972" viewBox="-40.0 -40.0 940.0 972.0" role="img"><title>When the history is summarized</title><defs><marker id="ah-default" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#346562" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-async" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#346562" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#cf1d39" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="-40.0" y="-40.0" width="940.0" height="972.0" fill="#ffffff"/><text x="-20.0" y="-18.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#346562"><tspan x="-20.0" dy="0.0">When the history is summarized</tspan></text><text x="-20.0" y="6.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#173245"><tspan x="-20.0" dy="0.0">Checked before every model call. The raw messages stay in the thread either way.</tspan></text><g transform="translate(0,56)"><rect x="280" y="0" width="220.0" height="56.0" rx="14.0" fill="#003247" stroke="#003247" stroke-width="1.5"/><text x="390.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="390.0" dy="0.0">Thread</tspan></text><rect x="280" y="110" width="220.0" height="56.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="390.0" y="138.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="390.0" dy="0.0">Count tokens</tspan></text><rect x="280" y="220" width="220.0" height="56.0" rx="14.0" fill="#e4eaea" stroke="#346562" stroke-width="1.5"/><text x="390.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#173245"><tspan x="390.0" dy="0.0">Over 85%?</tspan></text><rect x="640" y="220" width="220.0" height="56.0" rx="14.0" fill="#435e6d" stroke="#435e6d" stroke-width="1.5"/><text x="750.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="750.0" dy="0.0">Send unchanged</tspan></text><rect x="280" y="360" width="220.0" height="56.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="390.0" y="388.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="390.0" dy="0.0">Cut file arguments</tspan></text><rect x="280" y="500" width="220.0" height="56.0" rx="14.0" fill="#e4eaea" stroke="#346562" stroke-width="1.5"/><text x="390.0" y="528.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#173245"><tspan x="390.0" dy="0.0">Still over?</tspan></text><rect x="640" y="500" width="220.0" height="56.0" rx="14.0" fill="#435e6d" stroke="#435e6d" stroke-width="1.5"/><text x="750.0" y="528.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="750.0" dy="0.0">Send trimmed</tspan></text><rect x="280" y="640" width="220.0" height="56.0" rx="14.0" fill="#4a8a7a" stroke="#4a8a7a" stroke-width="1.5"/><text x="390.0" y="668.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="390.0" dy="0.0">Summarize older part</tspan></text><rect x="280" y="780" width="220.0" height="56.0" rx="14.0" fill="#003247" stroke="#003247" stroke-width="1.5"/><text x="390.0" y="808.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="390.0" dy="0.0">Summary + kept tail</tspan></text><path d="M390.0,56.0 L390.0,110.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><path d="M390.0,166.0 L390.0,220.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><path d="M500.0,248.0 L640.0,248.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><rect x="554.4" y="236.1" width="31.2" height="23.8" rx="11.9" fill="#ffffff" stroke="#346562" stroke-width="1"/><text x="570.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#173245"><tspan x="570.0" dy="0.0">no</tspan></text><path d="M390.0,276.0 L390.0,360.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><rect x="371.1" y="306.1" width="37.8" height="23.8" rx="11.9" fill="#ffffff" stroke="#346562" stroke-width="1"/><text x="390.0" y="318.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#173245"><tspan x="390.0" dy="0.0">yes</tspan></text><path d="M390.0,416.0 L390.0,500.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><path d="M500.0,528.0 L640.0,528.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><rect x="554.4" y="516.1" width="31.2" height="23.8" rx="11.9" fill="#ffffff" stroke="#346562" stroke-width="1"/><text x="570.0" y="528.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#173245"><tspan x="570.0" dy="0.0">no</tspan></text><path d="M390.0,556.0 L390.0,640.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><rect x="371.1" y="586.1" width="37.8" height="23.8" rx="11.9" fill="#ffffff" stroke="#346562" stroke-width="1"/><text x="390.0" y="598.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#173245"><tspan x="390.0" dy="0.0">yes</tspan></text><path d="M390.0,696.0 L390.0,780.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><rect x="0" y="372" width="240.0" height="34.2" rx="17.1" fill="#ffffff" stroke="#346562" stroke-width="1.5"/><text x="120.0" y="389.1" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#173245"><tspan x="120.0" dy="0.0">write_file, edit_file</tspan></text><rect x="0" y="652" width="250.0" height="34.2" rx="17.1" fill="#ffffff" stroke="#346562" stroke-width="1.5"/><text x="125.0" y="669.1" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#173245"><tspan x="125.0" dy="0.0">same model, 2,000 tokens</tspan></text><rect x="0" y="792" width="240.0" height="34.2" rx="17.1" fill="#ffffff" stroke="#346562" stroke-width="1.5"/><text x="120.0" y="809.1" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#173245"><tspan x="120.0" dy="0.0">last 10% stays verbatim</tspan></text></g></svg>