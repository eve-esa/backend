<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="-20.0 -12.0 1080.0 550.2" role="img"><title>Sandbox lifetime</title><defs><marker id="ah-default" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#346562" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-async" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#346562" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#cf1d39" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="-20.0" y="-12.0" width="1080.0" height="550.2" fill="#ffffff"/><text x="0.0" y="10.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#346562"><tspan x="0.0" dy="0.0">Sandbox lifetime</tspan></text><text x="0.0" y="34.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#173245"><tspan x="0.0" dy="0.0">One sandbox per conversation. The next message reuses it.</tspan></text><g transform="translate(0,56)"><rect x="20" y="36" width="130.0" height="72.0" rx="14.0" fill="#003247" stroke="#003247" stroke-width="1.5"/><text x="85.0" y="63.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="85.0" dy="0.0">Turn</tspan><tspan x="85.0" dy="17.5">starts</tspan></text><rect x="190" y="36" width="110.0" height="72.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="245.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="245.0" dy="0.0">Lock</tspan></text><rect x="340" y="28" width="140.0" height="88.0" rx="14.0" fill="#e4eaea" stroke="#346562" stroke-width="1.5"/><text x="410.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#173245"><tspan x="410.0" dy="0.0">Reuse?</tspan></text><rect x="530" y="36" width="130.0" height="72.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="595.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="595.0" dy="0.0">Attach</tspan></text><rect x="710" y="36" width="140.0" height="72.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="780.0" y="63.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="780.0" dy="0.0">Turn</tspan><tspan x="780.0" dy="17.5">runs</tspan></text><rect x="890" y="36" width="130.0" height="72.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="955.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="955.0" dy="0.0">Release</tspan></text><rect x="890" y="180" width="130.0" height="72.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="955.0" y="207.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="955.0" dy="0.0">Idle</tspan><tspan x="955.0" dy="17.5">600s</tspan></text><rect x="890" y="320" width="130.0" height="72.0" rx="14.0" fill="#003247" stroke="#003247" stroke-width="1.5"/><text x="955.0" y="347.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="955.0" dy="0.0">Reaper</tspan><tspan x="955.0" dy="17.5">stops</tspan></text><rect x="340" y="180" width="140.0" height="72.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="410.0" y="216.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="410.0" dy="0.0">Create</tspan></text><rect x="530" y="180" width="130.0" height="72.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="595.0" y="216.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="595.0" dy="0.0">Restore</tspan></text><text x="20.0" y="308.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#173245"><tspan x="20.0" dy="0.0">Other exits</tspan></text><rect x="20" y="328" width="150.0" height="72.0" rx="14.0" fill="#003247" stroke="#003247" stroke-width="1.5"/><text x="95.0" y="355.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="95.0" dy="0.0">Delete</tspan><tspan x="95.0" dy="17.5">discards</tspan></text><path d="M150.0,72.0 L190.0,72.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><path d="M300.0,72.0 L340.0,72.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><path d="M480.0,72.0 L530.0,72.0" fill="none" stroke="#346562" stroke-width="1.2" marker-end="url(#ah-default)"/><rect x="486.1" y="60.1" width="37.8" height="23.8" rx="11.9" fill="#ffffff" stroke="#346562" stroke-width="1"/><text x="505.