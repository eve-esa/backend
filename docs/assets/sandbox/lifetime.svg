, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#173245"><tspan x="410.0" dy="0.0">Gone, new provider, or AgentCore margin</tspan></text><rect x="700" y="196" width="175.0" height="34.2" rx="17.1" fill="#ffffff" stroke="#346562" stroke-width="1.5"/><text x="787.5" y="213.1" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#173245"><tspan x="787.5" dy="0.0">Lock is not held during the turn</tspan></text><rect x="220" y="328" width="170.0" height="72.0" rx="14.0" fill="#346562" stroke="#346562" stroke-width="1.5"/><text x="305.0" y="364.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff"><tspan x="305.0" dy="0.0">No conversation</tspan></text><rect x="178.8" y="408" width="252.4" height="34.2" rx="17.1" fill="#ffffff" stroke="#346562" stroke-width="1.5"/><text x="305.0" y="425.1" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#173245"><tspan x="305.0" dy="0.0">Destroyed when the turn ends</tspan></text></g></svg>