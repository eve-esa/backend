# Dependabot configuration.
# eve-esa-agents is installed from the AGENTS_REF build-arg, not from
# requirements.txt, so Dependabot does not see it. agents.ref is updated by a
# pull request from the agents repo when that repo cuts a tag.
version: 2
updates:
  # Python runtime and dev dependencies (requirements.txt, requirements-dev.txt).
  # This repo is requirements.txt-based: use the pip ecosystem, not uv,
  # until the project migrates to pyproject.toml + uv.lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      # Order matters: a dependency lands in the first group it matches.
      # The Mongo driver stack goes first and alone: langgraph-checkpoint-mongodb
      # caps pymongo, and motor wraps it, so a driver bump never rides with
      # unrelated minors and is reviewed against the checkpoint tests.
      mongo-driver:
        applies-to: "version-updates"
        patterns:
          - "pymongo"
          - "motor"
          - "langgraph-checkpoint-mongodb"
        update-types: ["minor", "patch"]
      mongo-driver-security:
        applies-to: "security-updates"
        patterns:
          - "pymongo"
          - "motor"
          - "langgraph-checkpoint-mongodb"
      langchain-ecosystem:
        applies-to: "version-updates"
        patterns:
          - "langchain*"
          - "langgraph*"
        update-types: ["minor", "patch"]
      docs-toolchain:
        applies-to: "version-updates"
        patterns:
          - "mkdocs*"
          - "mkdocstrings*"
          - "pymdown-extensions"
        update-types: ["minor", "patch"]
      python-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
      python-security:
        applies-to: "security-updates"
        patterns: ["*"]
    ignore:
      # Majors are handled manually with a human review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Dockerfile base image (python:3.12-slim-bookworm).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # A Python minor (3.12 to 3.15) is a new ABI, not a patch: wheels go missing and CI pins
    # the same version (U01 check in ci.yml). The tag already takes 3.12 patches on rebuild.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
      docker-security:
        applies-to: "security-updates"
        patterns: ["*"]

  # GitHub Actions workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
