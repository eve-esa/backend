name: deploy ecs

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment name (esa-eve-dev/staging/prod)"
        required: true
        type: string
      image-digest:
        description: "ECR image digest (sha256:...). Omit when promoting: the digest is then resolved from the source registry."
        required: false
        type: string
      promote:
        description: "Copy the image from this environment's promotion source before deploying. The source ACCOUNT comes from the environment variable SOURCE_ACCOUNT_ID, which only a job declaring the environment can read."
        required: false
        default: false
        type: boolean
      promote-from-repository:
        description: "Source ECR repository name, required with promote-from-account."
        required: false
        type: string
      version:
        description: "Version tag to apply in this environment's registry, required with promote-from-account."
        required: false
        type: string
      promote-from-tag:
        description: "Tag to read in the SOURCE registry. Defaults to the version: staging reads a sha-<short> tag from dev, prod reads the version from staging."
        required: false
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: esa-eve-${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1


      # Promotion happens INSIDE the deploy job on purpose. Both the copy and the deploy need
      # this environment's credentials, and an environment gate fires per job: as two jobs they
      # asked the reviewer twice for one decision, and a gate people click through twice is a
      # gate people stop reading. One job, one approval, one credential mint, and the deploy
      # path stays the single shared one for every environment.
      - name: Resolve the version digest in the source registry
        id: source
        if: inputs.promote
        env:
          VERSION: ${{ inputs.version }}
          SRC_ACCOUNT: ${{ vars.SOURCE_ACCOUNT_ID }}
          SRC_REPO: ${{ inputs.promote-from-repository }}
          SRC_TAG: ${{ inputs.promote-from-tag }}
        run: |
          set -euo pipefail
          # Exactly one leading v: the git tag and the tag this registry receives are the same
          # string end to end. The SOURCE tag can differ: staging reads dev's sha-<short> tag.
          VERSION="v${VERSION#v}"
          SRC_TAG="${SRC_TAG:-$VERSION}"
          DIGEST=$(aws ecr describe-images \
            --registry-id "$SRC_ACCOUNT" \
            --repository-name "$SRC_REPO" \
            --image-ids "imageTag=$SRC_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ "$DIGEST" = "None" ] || [ -z "$DIGEST" ]; then
            echo "ERROR: $SRC_TAG is not in $SRC_ACCOUNT/$SRC_REPO"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Found $SRC_TAG in the source registry: $DIGEST"

      - name: Download and verify crane
        if: inputs.promote
        run: |
          set -euo pipefail
          CRANE_VERSION="v0.21.7"
          # Checksum from the release's published checksums.txt: this job holds credentials for
          # two accounts at once, so the binary that moves images between them is pinned.
          CRANE_SHA="1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230"
          cd /tmp
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o crane.tar.gz
          echo "${CRANE_SHA}  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz crane
          chmod +x crane

      - name: Login to both registries
        if: inputs.promote
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registries: "${{ vars.SOURCE_ACCOUNT_ID }},${{ vars.AWS_ACCOUNT_ID }}"

      # Re-dispatching a promotion has to be safe. These repositories run tag mutability
      # IMMUTABLE_WITH_EXCLUSION, which locks the v* release series while leaving latest and
      # sha-* mutable, so a second unconditional `crane copy` of an already-promoted version
      # answers ImageTagAlreadyExistsException. That is precisely the case people hit: the copy
      # lands, a step AFTER it fails (the ECS health check timing out is the one we have seen),
      # and the natural fix is to dispatch the same promotion again. No deploy role carries
      # ecr:BatchDeleteImage, deliberately, so a hard failure here could only be cleared by a
      # human with separate admin credentials untagging the version by hand. Hence: look before
      # copying, and treat "already there, same digest" as success rather than as a collision.
      - name: Copy the image into this environment
        id: promote
        if: inputs.promote
        env:
          SRC: ${{ vars.SOURCE_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/${{ inputs.promote-from-repository }}@${{ steps.source.outputs.digest }}
          SRC_DIGEST: ${{ steps.source.outputs.digest }}
          DST: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/esa-eve-${{ inputs.environment }}-app-backend
          DST_REPO: esa-eve-${{ inputs.environment }}-app-backend
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail

          # describe-images has no boolean "does this tag exist": an absent tag is an
          # ImageNotFoundException and a non-zero exit, which under `set -e` would kill the step
          # before it got to decide anything. Running the call as the condition of an `if`
          # suspends `set -e` for it, and stderr is kept because the two non-zero outcomes must
          # not be conflated: only ImageNotFoundException means "not promoted yet", whereas an
          # AccessDenied or a throttle has to stop the run instead of being read as permission to
          # copy over a tag whose current contents we in fact failed to read.
          if DST_DIGEST=$(aws ecr describe-images \
                --repository-name "$DST_REPO" \
                --image-ids "imageTag=$VERSION" \
                --query 'imageDetails[0].imageDigest' --output text 2>/tmp/promote-describe-dst.err); then
            # A tag that resolves always carries a digest, so an empty or None answer means the
            # call did not tell us what is really there: same conclusion as an API error.
            if [ -z "$DST_DIGEST" ] || [ "$DST_DIGEST" = "None" ]; then
              echo "ERROR: describe-images returned no digest for $DST_REPO:$VERSION"
              exit 1
            fi
            ALREADY_TAGGED=true
          elif grep -q 'ImageNotFoundException' /tmp/promote-describe-dst.err; then
            ALREADY_TAGGED=false
          else
            echo "ERROR: could not determine whether $DST_REPO:$VERSION already exists"
            cat /tmp/promote-describe-dst.err >&2
            exit 1
          fi

          if [ "$ALREADY_TAGGED" = true ] && [ "$DST_DIGEST" != "$SRC_DIGEST" ]; then
            # A released version that already points somewhere else is not a re-run, it is a
            # rewrite of history: the git tag, the APP_VERSION the API reports and every task
            # definition that ever ran this version all assert that v<x> IS one specific
            # artifact. Print both digests, because the operator's next move depends on which
            # side is wrong: cut a new version, or fix what the promotion source resolves to.
            echo "ERROR: $DST_REPO:$VERSION already exists and points at a DIFFERENT image."
            echo "  already in this registry: $DST_DIGEST"
            echo "  asked to promote:         $SRC_DIGEST (from $SRC)"
            echo "Refusing to re-point a released version. Promote a new version instead."
            exit 1
          fi

          if [ "$ALREADY_TAGGED" = true ]; then
            # The re-run path. The registry is already correct, so the copy is skipped and the
            # steps below still deploy this digest, which is the entire reason for re-dispatching.
            echo "$DST_REPO:$VERSION was already promoted with digest $DST_DIGEST, skipping the copy"
          else
            echo "copying $SRC to $DST:$VERSION"
            /tmp/crane copy "$SRC" "$DST:$VERSION"
            # Read the tag back rather than reusing SRC_DIGEST: this is what the destination
            # registry actually resolves the version to, and it is what gets deployed.
            DST_DIGEST=$(aws ecr describe-images \
              --repository-name "$DST_REPO" \
              --image-ids "imageTag=$VERSION" \
              --query 'imageDetails[0].imageDigest' --output text)
            echo "promoted $VERSION with digest $DST_DIGEST"
          fi

          echo "digest=$DST_DIGEST" >> "$GITHUB_OUTPUT"

      # The digest the caller passed, or the one the copy just produced.
      - name: Resolve the digest to deploy
        id: image
        run: |
          DIGEST="${{ inputs.image-digest || steps.promote.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "ERROR: no digest to deploy, pass image-digest or set promote: true"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Fetch current task definition
        id: current-task
        run: |
          # Describe the task definition family's latest ACTIVE revision (not the service's live one)
          FAMILY="esa-eve-${{ inputs.environment }}-app-backend"
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query 'taskDefinition' \
            --output json)

          # Strip read-only fields: revision, taskDefinitionArn, status, requiresAttributes, compatibilities,
          # registeredAt, registeredBy, deregisteredAt
          echo "$TASK_DEF" | jq 'del(.revision, .taskDefinitionArn, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' > /tmp/task-def.json
          echo "family=$FAMILY" >> $GITHUB_OUTPUT

      # Deploy-time identity. The commit is already inside the image (Dockerfile ARG GIT_SHA);
      # the human version is not, because the build ran before the tag existed. Deploy is the
      # first moment the pipeline knows it: promotions pass the tag, dev has none and falls back
      # to the short sha of the commit the image was built from.
      - name: Resolve the application version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION" ]; then
            APP_VERSION="v${VERSION#v}"
          else
            APP_VERSION="sha-${SHA:0:7}"
          fi
          echo "app-version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying as $APP_VERSION"

      - name: Render task definition with new image digest
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: /tmp/task-def.json
          container-name: backend
          image: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/esa-eve-${{ inputs.environment }}-app-backend@${{ steps.image.outputs.digest }}
          # Upserted into the container's existing environment array by name, every other
          # variable and every valueFrom secret reference is left untouched.
          environment-variables: |
            APP_VERSION=${{ steps.version.outputs.app-version }}

      - name: Deploy task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        id: deploy
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: esa-eve-${{ inputs.environment }}-app-backend
          cluster: esa-eve-${{ inputs.environment }}-app-cluster
          wait-for-service-stability: true
          # Without this the SDK backs off exponentially, up to 120 seconds between polls, so the
          # step keeps running for minutes after ECS has already reported the service stable.
          # Measured on the v0.0.5 staging promotion: ECS reached steady state at 20:15:17 UTC and
          # the step was still waiting at 20:19:22. 15 is the value the action's own documentation
          # gives for consistent polling intervals.
          wait-max-delay-seconds: 15

      - name: Assert service's PRIMARY deployment uses new task definition
        run: |
          # Circuit-breaker rollback guard: verify the service's PRIMARY deployment is using the revision we just pushed
          # Ref: https://github.com/aws-actions/amazon-ecs-deploy-task-definition/issues/417
          CLUSTER="esa-eve-${{ inputs.environment }}-app-cluster"
          SERVICE="esa-eve-${{ inputs.environment }}-app-backend"
          EXPECTED_ARN="${{ steps.deploy.outputs.task-definition-arn }}"

          PRIMARY_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition' \
            --output text)

          if [ "$PRIMARY_ARN" != "$EXPECTED_ARN" ]; then
            echo "ERROR: Service PRIMARY deployment task definition mismatch"
            echo "Expected: $EXPECTED_ARN"
            echo "Actual: $PRIMARY_ARN"
            exit 1
          fi
          echo "PRIMARY deployment uses correct task definition"

      # An environment parked at desired_count 0 must not fail a promotion that did exactly what it
      # was asked to do. But "nobody wants tasks here" and "tasks were wanted and none are running"
      # are different states, and reading only runningCount conflated them: a deploy that started
      # nothing skipped its own verification and reported success. Read both counts and say which
      # case this is.
      - name: Read task counts
        id: running
        run: |
          set -euo pipefail
          read -r DESIRED COUNT <<<"$(aws ecs describe-services \
            --cluster "esa-eve-${{ inputs.environment }}-app-cluster" \
            --services "esa-eve-${{ inputs.environment }}-app-backend" \
            --query 'services[0].[desiredCount,runningCount]' --output text)"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Service wants ${DESIRED} task(s) and reports ${COUNT} running"

          if [ "$DESIRED" != "0" ] && [ "$COUNT" = "0" ]; then
            echo "ERROR: the service wants ${DESIRED} task(s) but none are running."
            echo "The deployment reported stable, so this is not a rollout still in progress."
            echo "Check the service events and the task stop reasons before promoting further."
            exit 1
          fi

          if [ "$DESIRED" = "0" ]; then
            echo "::warning::${{ inputs.environment }} is scaled to zero, so the image was deployed but nothing was verified."
          fi

      - name: Health check via CloudFront
        if: steps.running.outputs.count != '0'
        run: |
          HEALTH_URL="${{ vars.PUBLIC_URL }}/api/health"
          MAX_ATTEMPTS=6
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            if curl -sf "$HEALTH_URL" > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              WAIT=$((2 ** (ATTEMPT - 1)))
              echo "Health check attempt $ATTEMPT failed, waiting ${WAIT}s..."
              sleep $WAIT
            fi
          done

          echo "ERROR: Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      # Note: This workflow preserves valueFrom secret references only (Terraform owns secret VALUES).
      # Task definitions accumulate by design; future cleanup via aws ecs deregister-task-definition
      # is not automated in v1.
