name: deploy dev

# Application code plus this pipeline's own files: dev is where a pipeline change gets
# exercised. paths-ignore alone was too broad, it rebuilt and redeployed on every
# non-markdown commit, workflow edits included.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "templates/**"
      - "server.py"
      - "config.yaml"
      - "provider_models.yaml"
      - "requirements.txt"
      - "Dockerfile"
      - "start.sh"
      - "create_user.sh"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/deploy-ecs.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    environment: esa-eve-dev
    permissions:
      id-token: write
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Compute short SHA
        id: meta
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c # v2.1.6

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/esa-eve-dev-app-backend:sha-${{ steps.meta.outputs.short-sha }}
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/esa-eve-dev-app-backend:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    # The called workflow's job requests id-token; a caller job must grant at least that.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: dev
      image-digest: ${{ needs.build.outputs.digest }}
    secrets: inherit
