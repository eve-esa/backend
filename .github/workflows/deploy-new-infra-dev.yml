# Deploy to new-infra dev environment (esa-eve-dev)
# This workflow deploys the chosen branch to the NEW infrastructure's dev environment
# (account 012298690756, ECS Fargate) and touches nothing of the legacy pipeline or
# ClickOps estate. Triggered manually via workflow_dispatch with branch selection.
# Gated by the esa-eve-dev environment; inert until infra prerequisites PR is applied.

name: Deploy to new-infra dev (esa-eve-dev)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::012298690756:role/esa-eve-dev-app-deploy
  ECR_REPOSITORY: 012298690756.dkr.ecr.eu-west-1.amazonaws.com/esa-eve-dev-app-backend
  ECS_CLUSTER: esa-eve-dev-app-cluster
  ECS_SERVICE: esa-eve-dev-app-backend
  PUBLIC_URL: https://dev.eve-chat.chat

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Backend to ECS
    runs-on: ubuntu-latest
    environment:
      name: esa-eve-dev
      url: https://dev.eve-chat.chat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-action-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA_TAG: sha-${{ github.sha | truncate(7) }}
          IMAGE_LATEST_TAG: latest
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_SHA_TAG }} \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_LATEST_TAG }} .
          echo "image_sha_tag=${{ env.IMAGE_SHA_TAG }}" >> $GITHUB_OUTPUT
          echo "image_latest_tag=${{ env.IMAGE_LATEST_TAG }}" >> $GITHUB_OUTPUT

      - name: Download and graft Amazon RDS CA bundle
        env:
          IMAGE_SHA_TAG: ${{ steps.build-image.outputs.image_sha_tag }}
        run: |
          # Create a temporary Dockerfile for the CA bundle graft
          cat > Dockerfile.rds-ca << 'EOF'
          FROM ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_SHA_TAG }}
          RUN curl -s https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o /code/global-bundle.pem
          EOF

          # Build the final image with RDS CA bundle
          docker build -f Dockerfile.rds-ca \
            -t ${{ env.ECR_REPOSITORY }}:${{ steps.build-image.outputs.image_sha_tag }} \
            -t ${{ env.ECR_REPOSITORY }}:${{ steps.build-image.outputs.image_latest_tag }} .

      - name: Push image to Amazon ECR
        env:
          IMAGE_SHA_TAG: ${{ steps.build-image.outputs.image_sha_tag }}
          IMAGE_LATEST_TAG: ${{ steps.build-image.outputs.image_latest_tag }}
        run: |
          docker push ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_SHA_TAG }}
          docker push ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_LATEST_TAG }}
          echo "Pushed images:"
          echo "  - ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_SHA_TAG }}"
          echo "  - ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_LATEST_TAG }}"

      - name: Update ECS service (force new deployment)
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for ECS service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

      - name: Health check
        run: |
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.PUBLIC_URL }}/api/health)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i/30: Health check returned HTTP $HTTP_CODE, retrying..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

      - name: Generate step summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Deployment Summary

          **Environment:** esa-eve-dev

          **Image Tags:**
          - sha-${{ github.sha | truncate(7) }}
          - latest

          **Image URI:** ${{ env.ECR_REPOSITORY }}

          **Cluster:** ${{ env.ECS_CLUSTER }}
          **Service:** ${{ env.ECS_SERVICE }}

          **Public URL:** ${{ env.PUBLIC_URL }}

          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}

          EOF
