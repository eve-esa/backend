name: promote staging
run-name: promote staging ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ["v*"]
  # Re-promote a version that was already tagged, without moving or re-cutting the tag
  # (release-tags-immutable forbids both). Dispatch AGAINST THE TAG, never main: the
  # esa-eve-staging environment admits refs matching v* only, and a dispatch from a branch is
  # rejected before the first step runs. Note this therefore executes the workflow as it stood
  # at that tag, so a later pipeline fix reaches a released version only via a new tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (e.g., v1.2.3)"
        required: true
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false
  queue: max

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-latest
    environment: esa-eve-staging
    permissions:
      id-token: write
      contents: read
    outputs:
      digest: ${{ steps.copy.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The tag is resolved by name below, so it has to be in the clone, not just checked out.
          fetch-tags: true

      - name: Resolve tagged commit
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Resolve by tag NAME rather than github.ref: on dispatch the input is the authority on
          # what is being promoted, and it need not equal the ref the run was started from.
          # Normalize to exactly one leading v, as promote-prod does: the git tag and both ECR
          # tags are the same string by design.
          VERSION="${INPUT_VERSION:-${{ github.ref_name }}}"
          VERSION="v${VERSION#v}"

          if ! git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "ERROR: tag $VERSION does not exist"
            exit 1
          fi

          # Dereference annotated tag to commit SHA (safe for both annotated and lightweight tags)
          COMMIT_SHA=$(git rev-list -n 1 "refs/tags/$VERSION")
          SHORT_SHA="${COMMIT_SHA:0:7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit-sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "short-sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Tag $VERSION resolves to commit $COMMIT_SHA (short: $SHORT_SHA)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Resolve source image digest
        id: source-digest
        run: |
          # Look up the digest of the sha-<short7> tag in dev ECR
          # Use destination role with --registry-id to access source account
          TAG="sha-${{ steps.resolve.outputs.short-sha }}"
          DIGEST=$(aws ecr describe-images \
            --registry-id ${{ vars.SOURCE_ACCOUNT_ID }} \
            --repository-name esa-eve-dev-app-backend \
            --image-ids "imageTag=$TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>&1)

          if [ "$DIGEST" = "None" ] || [ -z "$DIGEST" ]; then
            echo "ERROR: Cannot find image $TAG in dev ECR. Image may have aged out."
            exit 1
          fi

          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Found digest for dev:$TAG -> $DIGEST"

      - name: Download and verify crane binary
        id: crane
        run: |
          # Download crane from go-containerregistry pinned release
          CRANE_VERSION="v0.21.7"
          CRANE_RELEASE_URL="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          # Verified sha256: https://github.com/google/go-containerregistry/releases/download/v0.21.7/checksums.txt
          CRANE_EXPECTED_SHA="1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230"

          echo "Downloading crane ${CRANE_VERSION}..."
          cd /tmp
          curl -sL "$CRANE_RELEASE_URL" -o crane.tar.gz

          # Verify the tarball hash
          ACTUAL_SHA=$(sha256sum crane.tar.gz | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$CRANE_EXPECTED_SHA" ]; then
            echo "ERROR: Crane tarball SHA256 mismatch"
            echo "Expected: $CRANE_EXPECTED_SHA"
            echo "Actual: $ACTUAL_SHA"
            exit 1
          fi

          tar -xzf crane.tar.gz
          chmod +x crane
          ./crane version
          echo "crane-path=/tmp/crane" >> $GITHUB_OUTPUT

      - name: Login to ECR (dual registries)
        run: |
          # Configure auth for both source and destination registries using single token
          AUTH_TOKEN=$(aws ecr get-login-password --region eu-west-1)
          echo "$AUTH_TOKEN" | /tmp/crane auth login -u AWS --password-stdin \
            ${{ vars.SOURCE_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com
          echo "$AUTH_TOKEN" | /tmp/crane auth login -u AWS --password-stdin \
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com

      - name: Copy image from dev to staging
        id: copy
        env:
          TAG: ${{ steps.resolve.outputs.version }}
        run: |
          SOURCE_IMAGE="${{ vars.SOURCE_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/esa-eve-dev-app-backend@${{ steps.source-digest.outputs.digest }}"
          DEST_IMAGE="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/esa-eve-staging-app-backend"

          echo "Copying $SOURCE_IMAGE -> $DEST_IMAGE:$TAG"
          /tmp/crane copy "$SOURCE_IMAGE" "$DEST_IMAGE:$TAG"

          # Resolve the destination digest
          DIGEST=$(aws ecr describe-images \
            --repository-name esa-eve-staging-app-backend \
            --image-ids "imageTag=$TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Promoted to staging as $TAG with digest $DIGEST"

  deploy:
    name: Deploy
    needs: promote
    # The called workflow's job requests id-token; a caller job must grant at least that.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: staging
      image-digest: ${{ needs.promote.outputs.digest }}
    secrets: inherit
