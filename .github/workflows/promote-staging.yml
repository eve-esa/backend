# Staging promotion, triggered by cutting a v* tag. The image built for that commit in dev is
# copied into the staging registry and deployed by digest: built once, never rebuilt. Same
# single-job shape as the production promotion.
name: promote staging
run-name: promote staging ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    name: Resolve the tagged commit
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # rev-list resolves lightweight and annotated tags alike to the commit, which is what the
      # dev image was tagged with.
      - name: Resolve the commit behind the tag
        id: sha
        run: |
          set -euo pipefail
          SHA=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "${GITHUB_REF_NAME} is commit ${SHA:0:7}"

  promote:
    name: Promote and deploy
    needs: resolve
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: staging
      version: ${{ github.ref_name }}
      promote-from-account: ${{ vars.SOURCE_ACCOUNT_ID }}
      promote-from-repository: esa-eve-dev-app-backend
      promote-from-tag: sha-${{ needs.resolve.outputs.short-sha }}
    secrets: inherit
