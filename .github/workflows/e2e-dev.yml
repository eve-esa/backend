# Browser end-to-end suite against dev after every successful backend dev deploy. The suite and
# its job live in eve-esa/frontend (.github/workflows/e2e-dev.yml, at main); this file only calls
# it, so a backend-only merge is tested without any credential that can write to the frontend
# repository. The called job runs here, under the esa-eve-dev environment of this repository,
# which holds the dev test account as E2E_EMAIL and E2E_PASSWORD.
#
# A separate workflow rather than a job in deploy-dev.yml: a red suite does not turn a good
# deploy red, and the release commit (deploy-dev.yml through workflow_call, no "deploy: dev" run
# of its own) is skipped, which is fine because it changes only version.txt and CHANGELOG.md.
name: "e2e: dev"
run-name: "e2e dev after backend ${{ github.event.workflow_run.head_sha }}"

on:
  workflow_run:
    workflows: ["deploy: dev"]
    types: [completed]

permissions: {}

jobs:
  e2e:
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    uses: eve-esa/frontend/.github/workflows/e2e-dev.yml@main
    with:
      target: dev
