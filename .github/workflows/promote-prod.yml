name: Promote to prod (dispatch with approval)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (e.g., v1.2.3)"
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-latest
    environment: esa-eve-prod
    permissions:
      id-token: write
      contents: read
    outputs:
      digest: ${{ steps.copy.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version exists in staging registry
        id: validate
        run: |
          VERSION="${{ inputs.version }}"

          # Verify the version tag exists in staging ECR
          aws ecr describe-images \
            --repository-name esa-eve-staging-app-backend \
            --image-ids "imageTag=$VERSION" \
            --query 'imageDetails[0].imageDigest' \
            --output text > /tmp/staging-digest.txt

          DIGEST=$(cat /tmp/staging-digest.txt)
          if [ "$DIGEST" = "None" ] || [ -z "$DIGEST" ]; then
            echo "ERROR: Cannot find version $VERSION in staging ECR"
            exit 1
          fi

          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Found $VERSION in staging ECR with digest $DIGEST"

      - name: Configure AWS credentials for source (staging)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        id: configure-source
        with:
          role-to-assume: arn:aws:iam::${{ vars.SOURCE_ACCOUNT_ID }}:role/esa-eve-staging-backend-deploy
          aws-region: eu-west-1

      - name: Configure AWS credentials for destination (prod)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Download and verify crane binary
        id: crane
        run: |
          # Download crane from go-containerregistry pinned release
          CRANE_VERSION="v0.21.7"
          CRANE_RELEASE_URL="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          CRANE_EXPECTED_SHA="5d0b64ac0a48db00be0ac78f6ad3fa2c09aab36c49c51e9ae8df6f6e7d9e5e7e"

          echo "Downloading crane ${CRANE_VERSION}..."
          cd /tmp
          curl -sL "$CRANE_RELEASE_URL" -o crane.tar.gz

          # Verify the tarball hash
          ACTUAL_SHA=$(sha256sum crane.tar.gz | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$CRANE_EXPECTED_SHA" ]; then
            echo "ERROR: Crane tarball SHA256 mismatch"
            echo "Expected: $CRANE_EXPECTED_SHA"
            echo "Actual: $ACTUAL_SHA"
            exit 1
          fi

          tar -xzf crane.tar.gz
          chmod +x crane
          ./crane version
          echo "crane-path=/tmp/crane" >> $GITHUB_OUTPUT

      - name: Login to ECR (dual registries)
        run: |
          # Configure auth for both source and destination registries
          aws ecr get-login-password --region eu-west-1 | \
            /tmp/crane auth login -u AWS --password-stdin \
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com

      - name: Copy image from staging to prod
        id: copy
        run: |
          VERSION="${{ inputs.version }}"
          SOURCE_IMAGE="${{ vars.SOURCE_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/esa-eve-staging-app-backend@${{ steps.validate.outputs.digest }}"
          DEST_IMAGE="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/esa-eve-prod-app-backend"

          echo "Copying $SOURCE_IMAGE -> $DEST_IMAGE:$VERSION"
          /tmp/crane copy "$SOURCE_IMAGE" "$DEST_IMAGE:$VERSION"

          # Resolve the destination digest
          DIGEST=$(aws ecr describe-images \
            --repository-name esa-eve-prod-app-backend \
            --image-ids "imageTag=$VERSION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Promoted to prod as $VERSION with digest $DIGEST"

  deploy:
    name: Deploy
    needs: promote
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: prod
      image-digest: ${{ needs.promote.outputs.digest }}
    secrets: inherit
