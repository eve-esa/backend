# Production promotion: the version already validated in staging is copied into the production
# registry and deployed, by digest, without rebuilding anything. A single job on purpose, so the
# reviewer approves the decision once rather than approving the copy and the deploy separately.
name: promote prod
run-name: promote prod ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to promote, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false
  queue: max

jobs:
  promote:
    name: Promote and deploy
    # The called job carries the esa-eve-prod environment: that is where the reviewer gate and
    # the OIDC subject the AWS role trusts both come from.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: prod
      version: ${{ inputs.version }}
      promote-from-account: ${{ vars.SOURCE_ACCOUNT_ID }}
      promote-from-repository: esa-eve-staging-app-backend
    secrets: inherit
