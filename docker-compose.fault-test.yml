# Local fault-tolerance fixtures for agentic error logging.
#
#   docker compose -f docker-compose.yml -f docker-compose.fault-test.yml up -d --build
#   docker compose exec backend python -m src.commands.register_dummy_mcp
#
# LOAD_DOTENV_OVERRIDE=false keeps these URLs from being replaced by the
# bind-mounted .env (config.py load_dotenv).
#
# In the UI (http://localhost:5173), send:
#   - "call fail_auth_text" / fail_structured / fail_raise  → MCP tool_error
#   - "please crash"                                        → LLM HTTP 500
#   - "hang and do not answer"                              → no first token
services:
  backend:
    environment:
      - LOAD_DOTENV_OVERRIDE=false
      - MAIN_MODEL_URL=http://dummy-llm:8000/v1
      - MAIN_MODEL_API_KEY=dummy
      - MAIN_MODEL_NAME=dummy-smart
      - FALLBACK_MODEL_URL=http://dummy-llm:8000/hang/v1
      - FALLBACK_MODEL_API_KEY=dummy
      - FALLBACK_MODEL_NAME=dummy-hang
      - AGENTIC_LLM_TYPE=main
      - EVE_ENDPOINT_ORDER=main,fallback
      - MODEL_TIMEOUT=8
      - MAIN_MODEL_TIMEOUT=8
      - AGENTIC_TIMEOUT=20
    depends_on:
      - dummy-llm

  frontend:
    environment:
      - VITE_API_URL=http://localhost:8001
